name: Build Android Internal Test APK

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Build profile (preview is standalone; development uses Metro)
        required: true
        type: choice
        default: preview
        options:
          - preview
          - development

permissions:
  contents: read

concurrency:
  group: android-internal-${{ inputs.profile }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ inputs.profile }} APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Build APK locally with EAS CLI
        run: |
          mkdir -p artifacts
          npx --yes eas-cli@24.8.0 build --platform android --profile "$EAS_PROFILE" --local --non-interactive --output "artifacts/qrplus-${EAS_PROFILE}.apk"
        env:
          EAS_PROFILE: ${{ inputs.profile }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: qrplus-${{ inputs.profile }}-apk
          path: artifacts/qrplus-${{ inputs.profile }}.apk
          if-no-files-found: error
          retention-days: 14
