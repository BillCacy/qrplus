name: Build Android Play Bundle

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-play-bundle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build production Android App Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Build App Bundle locally with EAS CLI
        run: |
          mkdir -p artifacts
          npx --yes eas-cli@24.8.0 build --platform android --profile production --local --non-interactive --output artifacts/qrplus-production.aab
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: qrplus-production-aab
          path: artifacts/qrplus-production.aab
          if-no-files-found: error
          retention-days: 14
